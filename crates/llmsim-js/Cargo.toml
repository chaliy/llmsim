# llmsim Node package: NAPI-RS addon that embeds the llmsim HTTP server.
# Built with `napi build` (see package.json); published to npm as `llmsim`.

[package]
name = "llmsim-js"
description = "Node.js/TypeScript bindings for the llmsim LLM API simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
doc = false

[dependencies]
llmsim = { path = "../..", default-features = false, features = ["server"] }
napi = { version = "3.8", default-features = false, features = ["napi6", "tokio_rt", "serde-json"] }
napi-derive = "3.5"
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "time", "sync"] }

[build-dependencies]
napi-build = "2"
